<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write an Email: A Visit to a Soft Play Center</title>
<style>
:root{--ink:#16294a;--c1:#e0703a;--c2:#ffe2c9;--ok:#1fa85a;--bad:#e0453a}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(170deg,#fff0d6 0%,#dcefff 100%);min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:1.25rem;font-weight:900;background:var(--c1);color:#fff;border-radius:40px;padding:8px 20px;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.stats{display:flex;gap:8px;align-items:center}
.pill{background:#fff;border:3px solid var(--c2);border-radius:30px;padding:6px 14px;font-weight:800}
button{font-family:inherit;cursor:pointer}
.mute{border:3px solid var(--c2);background:#fff;border-radius:50%;width:44px;height:44px;font-size:1.3rem}
.bar{height:14px;background:#fff;border-radius:10px;margin:12px 0;overflow:hidden;border:2px solid var(--c2)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),#ffbe3d);transition:width .5s}
.card{background:#fffdf7;border:4px solid var(--c1);border-radius:26px;padding:20px;margin:12px 0;box-shadow:0 6px 0 rgba(22,41,74,.13)}
h1,h2{margin:.2em 0}
.tag{display:inline-block;background:var(--c2);border-radius:12px;padding:4px 12px;font-weight:800}
.big{font-size:3.2rem;text-align:center;margin:4px 0}
.q{font-size:1.3rem;font-weight:800;text-align:center;line-height:1.5;margin:8px 0}
.line{background:#fff;border:3px dashed var(--c1);border-radius:16px;padding:12px 14px;text-align:center;font-size:1.25rem;font-weight:700;white-space:pre-line}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.opt{border:4px solid transparent;border-radius:16px;padding:12px;font-size:1.15rem;font-weight:800;color:var(--ink)}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c1)}
.opt.right{border-color:var(--ok);outline:3px solid #c9f3d8}
.opt.wrong{opacity:.4;text-decoration:line-through;border-color:var(--bad)}
.btn{background:var(--c1);color:#fff;border:0;border-bottom:5px solid rgba(0,0,0,.28);border-radius:16px;padding:12px 26px;font-size:1.15rem;font-weight:900;margin:10px 6px 0 0}
.btn.o{background:#ffbe3d;color:var(--ink)}
.btn:disabled{opacity:.4}
.btn:active{transform:translateY(3px)}
input[type=text],textarea{width:100%;font:inherit;font-size:1.2rem;padding:10px;border:4px solid var(--c2);border-radius:16px;color:var(--ink);background:#fff}
textarea{min-height:190px;font-size:1.1rem;line-height:1.5}
.tc{text-align:center}
input:focus,textarea:focus,button:focus-visible{outline:4px solid #ffbe3d}
.fb{min-height:30px;text-align:center;font-weight:900;font-size:1.1rem;margin-top:10px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.04)}}
.stars{font-size:3rem;text-align:center}
.center{text-align:center}
.part{border-radius:14px;padding:10px 14px;margin:6px 0;font-weight:700;white-space:pre-line;text-align:left}
.pool,.built{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.built{min-height:70px;border:3px dashed var(--c1);border-radius:16px;padding:8px;background:#fff}
.blk{border:3px solid transparent;border-radius:14px;padding:10px 12px;text-align:left;font-size:1rem;font-weight:700;color:var(--ink);white-space:pre-line}
.blk.g{border-color:var(--ok)}.blk.r{border-color:var(--bad)}
.blk:disabled{opacity:.3}
.chk{list-style:none;padding:0;margin:10px 0;font-weight:800}
.chk li{padding:6px 10px;border-radius:10px;margin:4px 0;background:#f2f2f2}
.chk li.y{background:#c9f3d8}.chk li.n{background:#ffd5d0}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.words button{background:#fff;border:3px solid var(--c2);border-radius:14px;padding:6px 12px;font-weight:800;color:var(--ink)}
.rev{margin:6px 0;padding:8px 12px;border-radius:12px;background:#fff0ec;border-left:6px solid var(--bad);text-align:left}
.fall{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fl 2.8s linear forwards;z-index:9}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
footer{text-align:center;font-weight:800;margin:18px 0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="wrap">
<header><div class="logo">✉️ Write an Email</div>
<div class="stats"><span class="pill">⭐ <span id="sc">0</span></span><span class="pill">🔥 <span id="st">0</span></span><button class="mute" id="mu" aria-label="Sound on or off">🔊</button></div></header>
<div class="bar"><i id="pg"></i></div>
<main id="app"></main>
<footer>Created by T.Badria Alfalahi ✨</footer></div>
<script>
const C={"greeting": "Hi Sara,", "opening": "How are you?", "sign": "Best wishes,\nNoor", "title": "A Visit to a Soft Play Center", "key": "play", "emoji": "🛝🎈🧸", "c1": "#e0703a", "c2": "#ffe2c9", "bg1": "#fff0d6", "bg2": "#dcefff", "subject": "My visit to a soft play center", "body": "Last Saturday, I visited a soft play center with my little cousins. We played in the ball pit, went down the slides and climbed on soft blocks. The children were very happy. I had a great time, too!", "bodyline": "We played in the ball pit, went down the slides and climbed on soft blocks.", "ending": "Would you like to go with us next time?", "words": ["visited", "played", "climbed", "enjoyed"], "prompt": "Write an email to Sara about a visit to a soft play center.", "fills": [{"s": "Last Saturday, I ___ (visit) a soft play center with my little cousins.", "a": ["visited"]}, {"s": "We ___ (play) in the ball pit.", "a": ["played"]}, {"s": "We ___ (climb) on soft blocks.", "a": ["climbed"]}, {"s": "We ___ (go) down the slides.", "a": ["went"]}, {"s": "I ___ (enjoy) the visit very much.", "a": ["enjoyed"]}]};
let ctx,muted=false,score=0,streak=0,best=0,idx=-1,name="",tries=0,locked=false,res=[],miss=[],ord=[],sh=[];
const $=id=>document.getElementById(id);
function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,d,type="sine",delay=0,vol=.2){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
const sfx={click:()=>tone(660,.08,"square",0,.08),ok:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",i*.09,.22)),no:()=>{tone(200,.25,"sawtooth",0,.15);tone(150,.3,"sawtooth",.15,.15)},win:()=>[523,659,784,659,784,1046,1318].forEach((f,i)=>tone(f,.25,"triangle",i*.13,.25)),star:()=>tone(1200,.15,"sine",0,.15),pop:()=>tone(880,.1,"sine",0,.15)};
function speak(t){if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/_+/g,"blank").replace(/\n/g,". "));u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}
function confetti(n=24){const e=["🎉","⭐","🌟","✨","✉️"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fall";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3800)}}
$("mu").onclick=()=>{muted=!muted;$("mu").textContent=muted?"🔇":"🔊";if(muted&&window.speechSynthesis)speechSynthesis.cancel();else sfx.click()};

const PARTS=["Subject","Greeting","Opening","Body","Ending"];
const PCOL={Subject:"#dff0fb",Greeting:"#fde1e8",Opening:"#def4e6",Body:"#fff0c4",Ending:"#e8defa"};
const PH={Subject:"The subject says what your email is about.",Greeting:"The greeting starts with Hi + your friend’s name.",Opening:"The opening asks how your friend is.",Body:"The body says when, who, what and how you felt.",Ending:"The ending asks a question and signs your name."};
const Q=[];
[[C.subject,"Subject"],[C.greeting,"Greeting"],[C.opening,"Opening"],[C.bodyline,"Body"],[C.ending,"Ending"],[C.sign,"Ending"]].forEach(([s,a])=>Q.push({t:"part",s,a}));
C.fills.forEach(f=>Q.push({t:"fill",s:f.s,a:f.a}));
Q.push({t:"order"},{t:"write"});
const BL=[{k:"Subject",t:"Subject: "+C.subject},{k:"Greeting",t:C.greeting},{k:"Opening",t:C.opening},{k:"Body",t:C.body},{k:"Ending",t:C.ending+"\n"+C.sign}];
const MAXPTS=6*10+C.fills.length*10+20+20;
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").trim();
function hud(){$("sc").textContent=score;$("st").textContent=streak;$("pg").style.width=Math.max(0,idx)/Q.length*100+"%"}
function start(){
 $("app").innerHTML=`<div class="card tc pop"><div class="big">${C.emoji}</div><h1>${C.title}</h1><p>Learn the 5 parts of an email, practise the past simple, then write your own email to Sara!</p>
 <p><input type="text" id="nm" maxlength="20" placeholder="Type your name" aria-label="Your name" class="tc" autocomplete="off"></p><button class="btn" onclick="go()">Start</button></div>`;hud()
}
function go(){ac();name=($("nm").value||"Writer").trim();sfx.click();speak("Hello "+name+"! Let's learn how to write an email.");learn()}
function say(t){sfx.click();speak(t)}
function learn(){
 idx=-1;hud();
 const ex=[["Subject","Subject: "+C.subject],["Greeting",C.greeting],["Opening",C.opening],["Body",C.body],["Ending",C.ending+"\n"+C.sign]];
 $("app").innerHTML=`<div class="card pop"><h2>Hello, ${name}! 👋</h2><p>Tap any part of the example email to hear it.</p>
 <div class="part" style="background:#fff;border:2px solid var(--c2)">To: sara@example.com</div>
 ${ex.map((e,i)=>`<div class="part" role="button" tabindex="0" style="background:${PCOL[e[0]]};cursor:pointer" onclick="say(this.dataset.t)" data-t="${e[1].replace(/"/g,"&quot;")}"><b>${i+1}. ${e[0]}:</b> ${PH[e[0]].split(". ")[0].replace(/^The \w+ /,"")}<br>${e[1]}</div>`).join("")}
 <p><b>Useful words:</b></p><div class="words">${C.words.map(w=>`<button onclick="say('${w}')">${w}</button>`).join("")}</div>
 <p>💡 <b>Tip:</b> Use the past simple to describe your visit.</p></div>
 <div class="center"><button class="btn o" onclick="next()">I’m ready! 🚀</button></div>`
}
function next(){idx++;tries=0;locked=false;sfx.click();hud();if(idx>=Q.length)return end();render()}
function head(l){return `<span class="tag">${l}</span> <span style="float:right;font-weight:800">${idx+1} / ${Q.length}</span>`}
function nextBtn(){const n=$("nx");if(n)n.innerHTML=`<button class="btn o" onclick="next()">${idx===Q.length-1?"See my result 🏆":"Next ➜"}</button>`}
function render(){
 const q=Q[idx];let h=`<div class="card pop">`;
 if(q.t==="part"){
  h+=`${head("Which part of the email?")}<div class="q">Read the line. Which part is it?</div><div class="line">${q.s}</div>
  <div class="opts">${PARTS.map(p=>`<button class="opt" style="background:${PCOL[p]}" onclick="pickPart(this,'${p}')">${p}</button>`).join("")}</div>`
 }else if(q.t==="fill"){
  h+=`${head("Past simple")}<div class="q">Write the past simple form of the verb.</div><div class="line">${q.s}</div>
  <p><input type="text" id="an" class="tc" placeholder="Type the verb" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Answer"></p><div class="center"><button class="btn" id="ck" onclick="checkFill()">Check ✔</button></div>`
 }else if(q.t==="order"){
  sh=[0,1,2,3,4].sort(()=>Math.random()-.5);ord=[];
  h+=`${head("Build the email")}<div class="q">Tap the parts in the correct order.</div><div class="built" id="built"></div><div class="pool" id="pool"></div><div class="center"><button class="btn" id="ck" onclick="checkOrder()" disabled>Check ✔</button></div>`
 }else{
  h+=`${head("Write your email")}<div class="q">${C.prompt}</div>
  <div class="part" style="background:#fff;border:2px solid var(--c2)">To: sara@example.com</div>
  <p><input type="text" id="sj" placeholder="Subject: ..." aria-label="Subject"></p>
  <textarea id="bd" placeholder="Hi Sara,&#10;How are you?&#10;Last Saturday, I visited ...&#10;Would you like ...?&#10;Best wishes,&#10;${name}" aria-label="Email text"></textarea>
  <div class="words">${C.words.map(w=>`<button onclick="say('${w}')">${w}</button>`).join("")}</div>
  <div class="center"><button class="btn" id="ck" onclick="checkWrite()">Check my email ✔</button></div><ul class="chk" id="cl"></ul>`
 }
 h+=`<div class="fb" id="fb" aria-live="polite"></div><div class="center" id="nx"></div></div>`;
 $("app").innerHTML=h;
 if(q.t==="order")drawOrder();
 if(q.t==="fill"){$("an").focus();$("an").addEventListener("keydown",e=>{if(e.key==="Enter")checkFill()})}
 if(q.t==="part")speak(q.s);if(q.t==="fill")speak(q.s)
}
function good(pts,msg,say_){
 locked=true;score+=pts;streak++;best=Math.max(best,streak);res[idx]=1;hud();sfx.ok();
 const f=$("fb");f.className="fb ok";f.textContent=msg+" +"+pts;
 if(streak%3===0){setTimeout(()=>{sfx.star();confetti(14)},350);f.textContent+="  🔥 "+streak+" in a row!"}
 if(say_)speak(say_);if($("ck"))$("ck").style.display="none";nextBtn()
}
function shake(){streak=0;hud();sfx.no();const c=$("app").firstElementChild;c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}
function give(ans,miss_){locked=true;res[idx]=0;miss.push(miss_);hud();const f=$("fb");f.className="fb no";f.innerHTML=`The answer is: <b>${ans}</b>`;if($("ck"))$("ck").style.display="none";nextBtn()}
function pickPart(b,p){
 if(locked)return;const q=Q[idx];
 if(p===q.a){b.classList.add("right");good(tries===0?10:5,tries===0?"Great! 🎉":"Good job! 👍");return}
 b.classList.add("wrong");b.disabled=true;tries++;shake();
 if(tries>=2){document.querySelectorAll(".opt").forEach(x=>{if(x.textContent===q.a)x.classList.add("right")});give(q.a,`“${q.s.replace(/\n/g," ")}” → <b>${q.a}</b>`);return}
 const f=$("fb");f.className="fb no";f.textContent="Not yet. Hint: "+PH[q.a]
}
function checkFill(){
 if(locked)return;const q=Q[idx],v=norm($("an").value);if(!v){$("an").focus();return}
 const full=q.s.replace(/___\s*\([^)]*\)/,q.a[0]);
 if(q.a.map(norm).includes(v)){good(tries===0?10:5,tries===0?"Perfect! 🎉":"Good job! 👍",full);return}
 tries++;shake();
 if(tries>=2){give(q.a[0],full.replace(q.a[0],`<b>${q.a[0]}</b>`));speak(full);return}
 const f=$("fb");f.className="fb no";f.textContent="Not yet. Hint: this happened last Saturday. Use the past simple.";$("an").select()
}
function drawOrder(){
 $("built").innerHTML=ord.length?ord.map((b,i)=>`<button class="blk ${locked?(b===i?"g":"r"):""}" style="background:${PCOL[BL[b].k]}" onclick="unpick(${i})" ${locked?"disabled":""}>${i+1}. ${BL[b].t}</button>`).join(""):`<span style="opacity:.6">Your email will appear here…</span>`;
 $("pool").innerHTML=sh.map(b=>`<button class="blk" style="background:${PCOL[BL[b].k]}" onclick="pickOrd(${b})" ${ord.includes(b)||locked?"disabled":""}>${BL[b].t}</button>`).join("");
 $("ck").disabled=ord.length<5||locked
}
function pickOrd(b){if(locked)return;sfx.pop();ord.push(b);drawOrder()}
function unpick(i){if(locked)return;sfx.pop();ord.splice(i,1);drawOrder()}
function checkOrder(){
 if(locked)return;tries++;const ok=ord.filter((b,i)=>b===i).length,f=$("fb");
 if(ok===5){const pts=tries===1?20:10;locked=true;drawOrder();good(pts,"Perfect email order! 🎉","Great! Your email is in the correct order.");return}
 shake();
 if(tries>=2){locked=true;const pts=ok*2;score+=pts;hud();res[idx]=ok>=3?1:0;if(!res[idx])miss.push("Email order: Subject → Greeting → Opening → Body → Ending");drawOrder();f.className="fb no";f.innerHTML=`${ok} / 5 in the right place. +${pts}<br>Correct order: Subject, Greeting, Opening, Body, Ending.`;$("ck").style.display="none";nextBtn();return}
 f.className="fb no";f.textContent=`${ok} / 5 are in the right place. Tap a part to remove it, then try again.`
}
function checks(sj,bd){
 const ps=(bd.match(/\b(\w+ed|saw|went|had|was|were|ate|made|took|came|did)\b/gi)||[]).length;
 return [
  ["Subject says what the email is about",new RegExp(C.key,"i").test(sj)&&sj.trim().split(/\s+/).length>=3],
  ["Greeting: Hi + friend’s name, with a comma",/^\s*hi\s+[a-z]+\s*,/i.test(bd)],
  ["Opening: How are you?",/how are you\s*\?/i.test(bd)],
  ["Body: at least 2 past simple verbs",ps>=2],
  ["Ending: a question + a sign-off with your name",(bd.match(/\?/g)||[]).length>=2&&/(best wishes|kind regards|regards|love|bye|from|your friend)[,\s]+[A-Za-z]+\s*$/i.test(bd.trim())]
 ]
}
function checkWrite(){
 if(locked)return;const sj=$("sj").value,bd=$("bd").value,f=$("fb");
 if(bd.trim().length<10){f.className="fb no";f.textContent="Write your email first.";return}
 tries++;const r=checks(sj,bd),n=r.filter(x=>x[1]).length;
 $("cl").innerHTML=r.map(x=>`<li class="${x[1]?"y":"n"}">${x[1]?"✅":"❌"} ${x[0]}</li>`).join("");
 if(n===5){good(tries===1?20:15,"Fantastic email! 🌟","Fantastic! Your email is ready to send.");return}
 shake();
 if(tries>=2){const pts=n*3;locked=true;score+=pts;hud();res[idx]=n>=4?1:0;if(!res[idx])miss.push("Your email: check the 5 parts again");sfx.ok();f.className="fb ok";f.textContent=`Nice try! +${pts}`;$("ck").style.display="none";nextBtn();return}
 f.className="fb no";f.textContent=`${n} / 5 parts are correct. Fix the ❌ and check again.`
}
function end(){
 hud();$("pg").style.width="100%";const pc=Math.round(score/MAXPTS*100),st=pc>=85?3:pc>=60?2:pc>=30?1:0,right=res.filter(x=>x===1).length;
 const msg=["Keep practising. You can do it! 💪","Good start! Try again for more stars.","Great work! Almost perfect!","Amazing! You are an email expert!"][st];
 sfx.win();confetti(40);speak("Well done "+name+"! Your score is "+score+" out of "+MAXPTS);
 $("app").innerHTML=`<div class="card tc pop"><h1>Well done, ${name}! 🏆</h1><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
 <h2>${score} / ${MAXPTS} points (${pc}%)</h2><p>Good answers: <b>${right}</b> / ${Q.length} · Best streak: <b>🔥 ${best}</b></p><p>${msg}</p>
 ${miss.length?`<p><b>Review:</b></p>${miss.map(m=>`<div class="rev">${m}</div>`).join("")}`:""}
 <button class="btn o" onclick="again()">Play again 🔄</button><button class="btn" onclick="learn()">Review the email 📘</button></div>`
}
function again(){score=0;streak=0;best=0;idx=-1;res=[];miss=[];sfx.click();learn()}
start();
</script></body></html>
